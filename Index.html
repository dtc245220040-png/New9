
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
</head>
<body>
    <h1>Lịch họp công ty</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp phòng kinh doanh</td>
        </tr>
        <tr>
            <td>09:00 - 10:00</td>
            <td>Họp phòng kỹ thuật</td>
        </tr>

        <tr>
            <td>Thứ Ba</td>
            <td>08:00 - 10:00</td>
            <td colspan="1">Họp toàn công ty</td>
        </tr>

        <tr>
            <td>Thứ Tư</td>
            <td colspan="2">08:00 - 10:00: Hội thảo đào tạo nhân viên</td>
        </tr>
    </table>
</body>
</html>
